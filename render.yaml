services:
  - type: web
    name: higienize-prime
    env: dotnet
    buildCommand: dotnet restore && dotnet publish -c Release -o out
    startCommand: dotnet out/GestaoHigienizePrime.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
